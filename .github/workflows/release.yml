name: Release

# Publishes the Denaria Agent Signer when Denaria's export pushes a `v<version>`
# tag. Nothing here holds a secret: npm accepts this workflow through trusted
# publishing (GitHub OIDC), and the provenance, the GitHub attestation and the
# release are all tied to this repository, this workflow and this commit.
# Every action is pinned to a commit. The `npm` environment carries the
# owner's approval before anything is published.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance, the attestation
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.2

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @denaria/agent-signer build
      # The same bytes Denaria built, the version of the tag, or no release.
      - run: node scripts/verify-release.mjs "$GITHUB_REF_NAME"

      - run: node apps/agent-signer/scripts/pack.mjs pack
      - name: SHA256SUMS
        working-directory: pack/dist
        run: sha256sum denaria-agent-signer.mjs | tee ../../SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: pack/dist/denaria-agent-signer.mjs

      - name: Publish to npm with provenance
        working-directory: pack
        run: npm publish --provenance --access public --ignore-scripts

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          pack/dist/denaria-agent-signer.mjs SHA256SUMS RELEASE.json
          --title "Denaria Agent Signer $GITHUB_REF_NAME"
          --notes "npm: @denaria/agent-signer@${GITHUB_REF_NAME#v}. Verify it: see SECURITY.md."
