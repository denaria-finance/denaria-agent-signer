interface:
  display_name: "Denaria Action Handoff"
  short_description: "Prepare Denaria QR handoffs through MCP"
  default_prompt: "Use /denaria-action-handoff to prepare a BTC long handoff QR for Denaria App/PWA review."
dependencies:
  tools:
    - type: "mcp"
      value: "denaria-agent-pack"
      description: "Local Denaria MCP wrapper that calls the official Denaria MCP endpoint and downloads QR images"
      transport: "stdio"
      command: "npx"
      args:
        - "-y"
        - "@denaria/agent-pack"
        - "mcp"
policy:
  allow_implicit_invocation: true
